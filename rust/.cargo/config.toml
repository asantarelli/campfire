# The C runtime is linked into the executable, so a Windows computer that never installed the Visual C++ redistributable
# (an old notebook) runs it all the same.
[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
