[package]
name = "sdcancionero"
description = "SDCancionero for Windows computers of 32 bits."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[build-dependencies]
winresource = "0.1"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
chordpro = { path = "../chordpro" }
library = { path = "../library" }
serde_json = { version = "1", features = ["preserve_order"] }
rfd = "0.15"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "clipboard", "links"] }
cpal = "0.18.2"
instruments = { version = "0.1.0", path = "../instruments" }
