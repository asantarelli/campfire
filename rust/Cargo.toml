# The Rust variant of SDCancionero: the same songbook as the Kotlin one, for the Windows computers that one cannot run on
# (32 bits). It shares nothing with Gradle and reads the same library (`.cho` songs, setlist documents, the zip an export
# writes), so the two can be used over one folder.

[workspace]
resolver = "2"
members = ["chordpro", "guitarpro", "instruments", "library", "sdcancionero"]

[workspace.package]
version = "5.0.10"
edition = "2021"
license = "MPL-2.0"
authors = ["SDigitales"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
